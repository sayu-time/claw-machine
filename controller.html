<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>인형뽑기 게임패드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  :root { --pink: #ff5fa2; --yellow: #ffd23f; --mint: #3ee6c1; --text: #fff6fb; --muted: #b9a9df; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; }
  body {
    background: radial-gradient(ellipse at 50% 120%, #3a1f73 0, #120a24 70%);
    color: var(--text); font-family: 'Jua', system-ui, sans-serif;
  }

  /* 게임패드 본체 */
  #pad {
    position: fixed; inset: 0;
    padding: max(10px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    display: grid; grid-template-columns: 1fr minmax(160px, 1.1fr) 1fr; grid-template-rows: auto 1fr; gap: 6px 12px;
  }
  header { grid-column: 1 / 4; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .pill { display: flex; align-items: center; gap: 6px; font-size: 14px; background: #ffffff14; padding: 5px 12px; border-radius: 99px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #777; }
  .dot.on { background: var(--mint); box-shadow: 0 0 8px var(--mint); }
  .logo { font-size: 18px; color: var(--yellow); }

  .zone { display: flex; align-items: center; justify-content: center; position: relative; }

  /* 조이스틱 */
  #stickBase {
    width: min(42vh, 30vw, 230px); aspect-ratio: 1; border-radius: 50%; position: relative;
    background: radial-gradient(circle at 50% 40%, #3b2a66, #1a1033 70%);
    box-shadow: inset 0 6px 18px rgba(0,0,0,.6), 0 0 0 6px #2a1a4d, 0 0 0 8px #4a3580;
    touch-action: none;
  }
  #stickBase::before, #stickBase::after { content: ''; position: absolute; background: #ffffff14; border-radius: 4px; }
  #stickBase::before { left: 50%; top: 14%; bottom: 14%; width: 4px; transform: translateX(-50%); }
  #stickBase::after { top: 50%; left: 14%; right: 14%; height: 4px; transform: translateY(-50%); }
  .arrowHint { position: absolute; color: #ffffff40; font-size: 14px; }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 46%; aspect-ratio: 1; border-radius: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 38% 32%, #ff9cc8, var(--pink) 45%, #b02a66 100%);
    box-shadow: 0 10px 18px rgba(0,0,0,.5), inset 0 -6px 10px rgba(0,0,0,.25);
    will-change: transform; z-index: 2;
  }
  #knob::after { content: ''; position: absolute; inset: 22%; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #ffc4dd, #ff7ab3); }
  #stickBase.disabled #knob { filter: grayscale(.8) brightness(.7); }

  /* 가운데 화면 */
  #screen {
    align-self: center; background: #0c0718; border-radius: 18px; padding: 12px 14px; min-height: 60%;
    box-shadow: inset 0 0 0 2px #ffffff10, inset 0 0 24px rgba(62,230,193,.06);
    display: flex; flex-direction: column; justify-content: center; text-align: center; gap: 6px; overflow: hidden;
  }
  #timer { font-size: 34px; color: var(--yellow); line-height: 1; display: none; }
  #timer.low { color: #ff6b6b; }
  #msg { font-size: 18px; line-height: 1.3; }
  #detail { font-size: 12px; color: var(--muted); line-height: 1.35; }
  .bars { display: grid; gap: 3px; margin-top: 2px; }
  .bar { display: grid; grid-template-columns: 38px 1fr 32px; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); }
  .track { height: 6px; background: #ffffff18; border-radius: 99px; overflow: hidden; position: relative; }
  .fill { height: 100%; background: var(--mint); border-radius: 99px; }
  .bar.total .fill { background: var(--yellow); }
  .mark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #fff; }
  #screen.win { background: linear-gradient(160deg, #ff8cc0, #ff5fa2); animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  #screen.win #detail { color: #fff; }
  #winIcon { font-size: 44px; line-height: 1; display: none; }
  #winIcon img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; }
  @keyframes pop { from { transform: scale(.85); } }

  /* 오른쪽 버튼 */
  .btns { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  #grab {
    width: min(38vh, 26vw, 190px); aspect-ratio: 1; border-radius: 50%; border: 0;
    font-family: inherit; font-size: clamp(20px, 5vh, 30px); color: #fff;
    background: radial-gradient(circle at 40% 30%, #ff8a8a, #ff3b3b 50%, #b81d1d);
    box-shadow: 0 12px 0 #7a1010, 0 16px 24px rgba(0,0,0,.5), inset 0 -8px 14px rgba(0,0,0,.2);
    text-shadow: 0 2px 0 rgba(0,0,0,.25); transition: transform .05s;
  }
  #grab.on { transform: translateY(10px); box-shadow: 0 2px 0 #7a1010, 0 4px 10px rgba(0,0,0,.5), inset 0 -4px 8px rgba(0,0,0,.2); }
  #grab:disabled { filter: grayscale(.7) brightness(.7); }
  #grab.pulse { animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 12px 0 #7a1010, 0 16px 24px rgba(0,0,0,.5), 0 0 0 10px rgba(255,59,59,.25); } }
  #cam {
    border: 0; font-family: inherit; font-size: 14px; color: var(--text); background: #ffffff1a;
    padding: 9px 16px; border-radius: 99px; box-shadow: 0 4px 0 #0006;
  }
  #cam.on { transform: translateY(3px); box-shadow: 0 1px 0 #0006; }

  /* 안내 오버레이 */
  .overlay { position: fixed; inset: 0; background: rgba(10,5,25,.92); display: flex; align-items: center; justify-content: center; text-align: center; padding: 30px; font-size: 20px; z-index: 5; flex-direction: column; gap: 16px; }
  .overlay.hide { display: none; }
  .overlay button { font: inherit; font-size: 18px; border: 0; border-radius: 16px; padding: 12px 22px; background: var(--yellow); color: #2a1a52; }
  .overlay .sub { font-size: 14px; color: var(--muted); }
  .overlay .ghost { background: #ffffff1a; color: var(--text); }
  #rotate .phone { font-size: 64px; animation: rot 1.6s ease-in-out infinite; }
  @keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: landscape) { #rotate { display: none !important; } }
</style>
</head>
<body>
  <div id="pad">
    <header>
      <span class="logo">🕹️ 인형뽑기</span>
      <div class="pill"><span class="dot" id="dot"></span><span id="conn">연결 중</span></div>
    </header>

    <div class="zone">
      <div id="stickBase">
        <span class="arrowHint" style="top:4%;left:50%;transform:translateX(-50%)">뒤</span>
        <span class="arrowHint" style="bottom:4%;left:50%;transform:translateX(-50%)">앞</span>
        <span class="arrowHint" style="left:5%;top:50%;transform:translateY(-50%)">◀</span>
        <span class="arrowHint" style="right:5%;top:50%;transform:translateY(-50%)">▶</span>
        <div id="knob"></div>
      </div>
    </div>

    <div id="screen">
      <div id="winIcon"></div>
      <div id="timer">30</div>
      <div id="msg">연결하는 중…</div>
      <div id="detail"></div>
      <div class="bars" id="bars"></div>
    </div>

    <div class="zone btns">
      <button id="grab">뽑기!</button>
      <button id="cam">📷 시점</button>
    </div>
  </div>

  <div class="overlay" id="rotate">
    <div class="phone">📱</div>
    <div>폰을 <b>가로</b>로 돌려주세요</div>
    <div class="sub">게임패드처럼 양손으로 잡고 해요</div>
  </div>

  <div class="overlay hide" id="overlay"><div id="ovText">게임 화면에 연결하는 중…</div></div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="net.js"></script>
<script>
(() => {
  const room = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
  const $ = (id) => document.getElementById(id);
  const ov = $('overlay'), ovText = $('ovText');
  const myId = Math.random().toString(36).slice(2, 10);
  let net, joined = false, phase = 'ready', kicked = false, lastHost = 0;

  function showOverlay(text, retry) {
    ov.classList.remove('hide');
    ovText.textContent = text;
    ov.querySelectorAll('button').forEach(b => b.remove());
    if (retry) {
      const b = document.createElement('button'); b.textContent = '다시 연결';
      b.onclick = () => { kicked = false; showOverlay('게임 화면에 연결하는 중…'); net.send({ type: 'join', id: myId }); };
      ov.appendChild(b);
    }
  }
  function setJoined(on) { joined = on; $('dot').classList.toggle('on', on); $('conn').textContent = on ? '연결됨' : '끊김'; }
  function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }

  if (!room) { showOverlay('주소에 방 코드가 없어요. PC 화면의 QR을 찍어주세요.'); return; }

  // 첫 터치 때 전체화면 + 가로 고정 시도 (안드로이드)
  let triedFs = false;
  function tryFullscreen() {
    if (triedFs) return; triedFs = true;
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) Promise.resolve(req.call(el)).then(() => screen.orientation?.lock?.('landscape')).catch(() => {});
  }
  document.addEventListener('pointerdown', tryFullscreen, { once: true });

  function send(m) { if (joined) net.send({ ...m, id: myId }); }

  // ---------- 화면 표시 ----------
  const PHASE_TEXT = { drop: '집게 내려가는 중…', close: '꽉!', rise: '올라가는 중…', return: '출구로 이동 중…', open: '두근두근…' };
  let resultShownAt = 0;
  function setScreen(msg, detail = '', bars = null, secure = 0.6) {
    $('msg').textContent = msg;
    $('detail').textContent = detail;
    const box = $('bars'); box.innerHTML = '';
    if (bars) for (const [label, v, mark] of bars) {
      const row = document.createElement('div'); row.className = 'bar' + (mark ? ' total' : '');
      row.innerHTML = `<span>${label}</span><div class="track"><div class="fill" style="width:${Math.round(v * 100)}%"></div>${mark ? `<div class="mark" style="left:${mark * 100}%"></div>` : ''}</div><span>${Math.round(v * 100)}%</span>`;
      box.appendChild(row);
    }
  }
  function idleScreen() {
    $('screen').classList.remove('win'); $('winIcon').style.display = 'none';
    setScreen('조이스틱을 움직이면 시작!', '집게 그림자를 보고 인형 정중앙에 맞춰보세요');
  }
  function onState(m) {
    const prev = phase; phase = m.phase;
    const busy = !['ready', 'move'].includes(phase);
    $('grab').disabled = busy;
    $('stickBase').classList.toggle('disabled', busy);
    $('grab').classList.toggle('pulse', phase === 'move');
    const t = $('timer');
    t.style.display = phase === 'move' ? 'block' : 'none';
    t.textContent = m.timer; t.classList.toggle('low', m.timer <= 5);
    if (phase === 'move' && prev !== 'move') { $('screen').classList.remove('win'); $('winIcon').style.display = 'none'; setScreen('움직여서 위치를 맞추고', '빨간 버튼을 누르면 집게가 내려가요'); }
    if (busy && PHASE_TEXT[phase]) { $('screen').classList.remove('win'); $('winIcon').style.display = 'none'; setScreen(PHASE_TEXT[phase]); }
    if (phase === 'ready' && prev === 'move') idleScreen();
    if (phase === 'ready' && prev !== 'ready' && Date.now() - resultShownAt > 1500 && prev === 'open') { /* 결과 메시지 대기 */ }
    if (phase === 'move' && m.timer <= 5 && m.timer !== lastTick) { lastTick = m.timer; buzz(25); }
  }
  let lastTick = -1;
  function onResult(m) {
    resultShownAt = Date.now();
    if (m.ok) $('screen').classList.add('win');
    setScreen(m.title, m.detail, m.bars, m.secure);
    buzz(m.ok ? [120, 60, 120, 60, 400] : [180]);
    setTimeout(() => { if (phase === 'ready' && Date.now() - resultShownAt >= 9000) idleScreen(); }, 9500);
  }
  function onFx(m) {
    if (m.kind === 'touch') buzz(35);
    if (m.kind === 'grab') buzz([40, 30, 60]);
    if (m.kind === 'slip') buzz([20, 40, 20, 40, 120]);
    if (m.kind === 'win') {
      const ic = $('winIcon'); ic.style.display = 'block';
      ic.innerHTML = m.img ? `<img src="${m.img}">` : (m.emoji || '🎁');
      $('screen').classList.add('win');
      setScreen(`${m.name} 당첨! 🎉`);
      buzz([120, 60, 120, 60, 400]);
    }
  }

  // ---------- 연결 ----------
  function connect() {
    showOverlay('게임 화면에 연결하는 중…');
    net = ClawNet.open(room, 'ctl', {
      onOpen: () => { if (!kicked) net.send({ type: 'join', id: myId }); },
      onClose: () => { if (joined) { setJoined(false); showOverlay('인터넷 연결이 끊겼어요. 다시 연결하는 중…'); } },
      onMessage: (m) => {
        if (m.type === 'joined' && m.id === myId) { setJoined(true); lastHost = Date.now(); ov.classList.add('hide'); idleScreen(); buzz(30); }
        if (m.type === 'kicked' && m.id === myId) { kicked = true; setJoined(false); showOverlay('다른 폰이 게임패드로 연결됐어요.', true); }
        if (m.type === 'state') {
          lastHost = Date.now();
          if (!joined && !kicked) net.send({ type: 'join', id: myId });
          if (joined) onState(m);
        }
        if (!joined) return;
        if (m.type === 'result') onResult(m);
        if (m.type === 'fx') onFx(m);
        if (m.type === 'cam') $('cam').textContent = m.name;
      },
    });
    setInterval(() => {
      if (joined) net.send({ type: 'ping', id: myId });
      else if (!kicked && net.online) net.send({ type: 'join', id: myId });
      if (joined && Date.now() - lastHost > 9000) { setJoined(false); showOverlay('PC 게임 화면을 찾을 수 없어요. 화면이 열려 있는지 확인해주세요.'); }
    }, 2000);
  }

  // ---------- 조이스틱 ----------
  const base = $('stickBase'), knob = $('knob');
  let pid = null, sx = 0, sy = 0, lastSent = { x: 0, y: 0 }, lastSendAt = 0, wasMoving = false;
  function setKnob(x, y) {
    const r = base.clientWidth * 0.32;
    knob.style.transform = `translate(calc(-50% + ${x * r}px), calc(-50% + ${-y * r}px))`;
  }
  function stickFrom(e) {
    const rect = base.getBoundingClientRect();
    const r = rect.width * 0.32;
    let x = (e.clientX - (rect.left + rect.width / 2)) / r;
    let y = -(e.clientY - (rect.top + rect.height / 2)) / r;
    const len = Math.hypot(x, y);
    if (len > 1) { x /= len; y /= len; }
    // 데드존
    const m = Math.hypot(x, y);
    if (m < 0.18) { x = 0; y = 0; }
    sx = x; sy = y; setKnob(x, y);
    const moving = m >= 0.18;
    if (moving !== wasMoving) { buzz(moving ? 12 : 0); wasMoving = moving; }
    pushStick();
  }
  function pushStick(force) {
    const now = performance.now();
    const changed = Math.abs(sx - lastSent.x) > 0.06 || Math.abs(sy - lastSent.y) > 0.06 || ((sx === 0 && sy === 0) !== (lastSent.x === 0 && lastSent.y === 0));
    if (force || (changed && now - lastSendAt > 45)) {
      send({ type: 'stick', x: +sx.toFixed(2), y: +sy.toFixed(2) });
      lastSent = { x: sx, y: sy }; lastSendAt = now;
    }
  }
  base.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (pid !== null) return;
    pid = e.pointerId; base.setPointerCapture(pid);
    stickFrom(e);
  });
  base.addEventListener('pointermove', (e) => { if (e.pointerId === pid) stickFrom(e); });
  const release = (e) => {
    if (e.pointerId !== pid) return;
    pid = null; sx = sy = 0; setKnob(0, 0); wasMoving = false;
    pushStick(true);
  };
  base.addEventListener('pointerup', release);
  base.addEventListener('pointercancel', release);
  // 누르고 있는 동안 주기적으로 재전송 (PC가 신호 유실로 멈추지 않게)
  setInterval(() => { if (pid !== null && (sx || sy)) send({ type: 'stick', x: +sx.toFixed(2), y: +sy.toFixed(2) }); }, 400);

  // ---------- 버튼 ----------
  const grab = $('grab');
  grab.addEventListener('pointerdown', (e) => {
    e.preventDefault(); if (grab.disabled) return;
    grab.classList.add('on'); buzz(50);
    send({ type: 'grab' });
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => grab.addEventListener(t, () => grab.classList.remove('on')));
  const cam = $('cam');
  cam.addEventListener('pointerdown', (e) => { e.preventDefault(); cam.classList.add('on'); buzz(15); send({ type: 'cam' }); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => cam.addEventListener(t, () => cam.classList.remove('on')));
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  connect();
})();
</script>
</body>
</html>
