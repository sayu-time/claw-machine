<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1035">
<title>인형뽑기 컨트롤러</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  :root { --bg: #1b1035; --panel: #2a1a52; --pink: #ff5fa2; --yellow: #ffd23f; --mint: #3ee6c1; --text: #fff6fb; --muted: #c9b8ef; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; overscroll-behavior: none; touch-action: none; }
  body {
    background: radial-gradient(circle at 50% 0, #3a1f73 0, var(--bg) 70%);
    color: var(--text); font-family: 'Jua', system-ui, sans-serif;
    display: flex; flex-direction: column; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  h1 { margin: 0; font-size: 26px; color: var(--yellow); text-shadow: 0 2px 0 #b8387a; }
  .pill { display: flex; align-items: center; gap: 6px; font-size: 15px; background: var(--panel); padding: 6px 12px; border-radius: 99px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #888; }
  .dot.on { background: var(--mint); box-shadow: 0 0 8px var(--mint); }

  #screen { margin: 16px 0; background: var(--panel); border-radius: 22px; padding: 18px; text-align: center; min-height: 120px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
  #msg { font-size: 24px; }
  #timer { font-size: 15px; color: var(--muted); }
  #resIcon { font-size: 64px; line-height: 1; display: none; }
  #resIcon img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 4px solid #fff; }
  #screen.win { background: linear-gradient(160deg, #ff8cc0, #ff5fa2); animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.8); } to { transform: none; } }

  .pad { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr auto; gap: 14px; min-height: 260px; }
  .btn { border: 0; border-radius: 26px; font-family: inherit; color: #2a1a52; display: flex; align-items: center; justify-content: center; font-size: 64px; touch-action: none; }
  .arrow { background: #f1e9ff; box-shadow: 0 8px 0 #9b87c9; }
  .arrow.on, .arrow:active { transform: translateY(6px); box-shadow: 0 2px 0 #9b87c9; background: #fff; }
  #grab { grid-column: 1 / 3; background: var(--pink); color: #fff; font-size: 34px; height: 120px; border-radius: 60px; box-shadow: 0 10px 0 #a5265f; gap: 10px; }
  #grab.on { transform: translateY(8px); box-shadow: 0 2px 0 #a5265f; }
  #grab:disabled, .arrow:disabled { opacity: .45; }

  #overlay { position: fixed; inset: 0; background: rgba(10,5,25,.85); display: flex; align-items: center; justify-content: center; text-align: center; padding: 30px; font-size: 22px; z-index: 5; flex-direction: column; gap: 16px; }
  #overlay.hide { display: none; }
  #overlay button { font: inherit; font-size: 20px; border: 0; border-radius: 16px; padding: 14px 24px; background: var(--yellow); color: #2a1a52; }
  @media (orientation: landscape) and (max-height: 500px) {
    body { flex-direction: row; gap: 16px; flex-wrap: wrap; }
    header { width: 100%; }
    #screen { margin: 0; width: 34%; }
    .pad { min-height: 0; grid-template-columns: 1fr 1fr 1.2fr; grid-template-rows: 1fr; }
    #grab { grid-column: auto; height: auto; }
  }
</style>
</head>
<body>
  <header>
    <h1>🕹️ 인형뽑기</h1>
    <div class="pill"><span class="dot" id="dot"></span><span id="conn">연결 중</span></div>
  </header>

  <div id="screen">
    <div id="resIcon"></div>
    <div id="msg">연결하는 중…</div>
    <div id="timer"></div>
  </div>

  <div class="pad">
    <button class="btn arrow" id="left" aria-label="왼쪽">◀</button>
    <button class="btn arrow" id="right" aria-label="오른쪽">▶</button>
    <button class="btn" id="grab">✊ 뽑기!</button>
  </div>

  <div id="overlay"><div id="ovText">게임 화면에 연결하는 중…</div></div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="net.js"></script>
<script>
(() => {
  const room = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
  const $ = (id) => document.getElementById(id);
  const ov = $('overlay'), ovText = $('ovText');
  const myId = Math.random().toString(36).slice(2, 10);
  let net, joined = false, phase = 'idle', kicked = false, lastHost = 0;

  function showOverlay(text, retry) {
    ov.classList.remove('hide');
    ovText.textContent = text;
    const old = ov.querySelector('button'); if (old) old.remove();
    if (retry) {
      const b = document.createElement('button'); b.textContent = '다시 연결';
      b.onclick = () => { kicked = false; showOverlay('게임 화면에 연결하는 중…'); net.send({ type: 'join', id: myId }); };
      ov.appendChild(b);
    }
  }
  function setJoined(on) {
    joined = on;
    $('dot').classList.toggle('on', on);
    $('conn').textContent = on ? '연결됨' : '끊김';
  }

  if (!room) { showOverlay('주소에 방 코드가 없어요. PC 화면의 QR을 찍어주세요.'); return; }

  function send(m) { if (joined) net.send({ ...m, id: myId }); }
  function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }

  function connect() {
    showOverlay('게임 화면에 연결하는 중…');
    net = ClawNet.open(room, 'ctl', {
      onOpen: () => { if (!kicked) net.send({ type: 'join', id: myId }); },
      onClose: () => { if (joined) { setJoined(false); showOverlay('인터넷 연결이 끊겼어요. 다시 연결하는 중…'); } },
      onMessage: (m) => {
        if (m.type === 'joined' && m.id === myId) {
          setJoined(true); lastHost = Date.now(); ov.classList.add('hide');
          resetScreen(); buzz(30);
        }
        if (m.type === 'kicked' && m.id === myId) {
          kicked = true; setJoined(false); showOverlay('다른 폰이 컨트롤러로 연결됐어요.', true);
        }
        if (m.type === 'state') {
          lastHost = Date.now();
          if (!joined && !kicked) net.send({ type: 'join', id: myId });   // PC 화면이 새로 켜진 경우
          if (joined) onState(m);
        }
        if (m.type === 'result' && joined) onResult(m);
      },
    });
    // 살아있다는 신호 + PC 화면 감시
    setInterval(() => {
      if (joined) net.send({ type: 'ping', id: myId });
      else if (!kicked && net.online) net.send({ type: 'join', id: myId });
      if (joined && Date.now() - lastHost > 9000) {
        setJoined(false); showOverlay('PC 게임 화면을 찾을 수 없어요. 화면이 열려 있는지 확인해주세요.');
      }
    }, 2000);
  }

  function setMsg(t) { $('msg').textContent = t; }

  const PHASE_TEXT = { drop: '집게 내려가는 중… ⬇', close: '꽉! 🤏', rise: '올라가는 중… ⬆', carry: '출구로 이동 중…', release: '두근두근…' };
  function onState(m) {
    const prev = phase; phase = m.phase;
    const busy = phase !== 'idle';
    $('left').disabled = $('right').disabled = $('grab').disabled = busy;
    if (busy) { setMsg(PHASE_TEXT[phase] || ''); $('timer').textContent = ''; }
    else {
      if (prev !== 'idle') setTimeout(() => { if (phase === 'idle') resetScreen(); }, 2500);
      $('timer').textContent = m.playing ? `⏱ 남은 시간 ${m.timer}초` : '';
    }
  }
  function resetScreen() {
    $('screen').classList.remove('win'); $('resIcon').style.display = 'none';
    setMsg('◀ ▶ 로 움직이고 뽑기!');
  }
  function onResult(m) {
    setMsg(m.text);
    if (m.ok) {
      $('screen').classList.add('win');
      const ic = $('resIcon'); ic.style.display = 'block';
      ic.innerHTML = m.img ? `<img src="${m.img}">` : (m.emoji || '🎁');
      buzz([100, 60, 100, 60, 300]);
    } else buzz(200);
  }

  // 길게 누르기 (좌/우)
  function hold(el, key) {
    const down = (e) => { e.preventDefault(); if (el.disabled) return; el.classList.add('on'); send({ type: 'input', key, down: true }); buzz(10); };
    const up = (e) => { e.preventDefault(); if (!el.classList.contains('on')) return; el.classList.remove('on'); send({ type: 'input', key, down: false }); };
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('pointerleave', up);
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  }
  hold($('left'), 'left');
  hold($('right'), 'right');

  const grab = $('grab');
  grab.addEventListener('pointerdown', (e) => {
    e.preventDefault(); if (grab.disabled) return;
    grab.classList.add('on'); buzz(60);
    send({ type: 'input', key: 'left', down: false });
    send({ type: 'input', key: 'right', down: false });
    send({ type: 'grab' });
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => grab.addEventListener(t, () => grab.classList.remove('on')));

  connect();
})();
</script>
</body>
</html>
