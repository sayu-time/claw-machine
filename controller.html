<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0f12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>강동 청년회 럭키박스 게임패드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
<style>
  :root { --lime: #b6f24a; --lime2: #7fb81c; --peach: #ffd9c4; --text: #f4f4f6; --muted: #8d8d99; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; }
  body { background: radial-gradient(ellipse at 50% 110%, #24242c 0, #0f0f12 70%); color: var(--text); font-family: 'Pretendard Variable', Pretendard, 'Noto Sans KR', system-ui, sans-serif; letter-spacing: -0.01em; }

  #pad {
    position: fixed; inset: 0;
    padding: max(12px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    display: grid; grid-template-columns: 1fr minmax(170px, 0.9fr) 1fr; grid-template-rows: auto 1fr; gap: 6px 16px;
  }
  header { grid-column: 1 / 4; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-size: 18px; color: #e6e8ec; }
  .logo small { font-size: 12px; color: var(--lime); margin-left: 8px; }
  .pill { display: flex; align-items: center; gap: 6px; font-size: 13px; background: #ffffff12; padding: 5px 12px; border-radius: 99px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
  .dot.on { background: var(--lime); box-shadow: 0 0 8px var(--lime); }

  .zone { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .arrow {
    width: min(30vh, 17vw, 150px); aspect-ratio: 1; border: 0; border-radius: 28px;
    font-size: clamp(34px, 10vh, 60px); color: #e8e8ee; font-family: inherit;
    background: linear-gradient(180deg, #3a3a45, #26262e); box-shadow: 0 8px 0 #121216, 0 12px 20px rgba(0,0,0,.5), inset 0 1px 0 #ffffff18;
    display: flex; align-items: center; justify-content: center; touch-action: none;
  }
  .arrow.on { transform: translateY(6px); box-shadow: 0 2px 0 #121216, 0 4px 10px rgba(0,0,0,.5), inset 0 1px 0 #ffffff18; background: linear-gradient(180deg, #4a4a58, #33333d); color: var(--lime); }
  .arrow:disabled, #grab:disabled { opacity: .35; }

  #screen {
    align-self: center; background: #050507; border-radius: 18px; padding: 14px; min-height: 62%;
    box-shadow: inset 0 0 0 2px #ffffff0d; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 6px;
    transition: background .3s, color .3s;
  }
  #icon { font-size: 40px; line-height: 1; }
  #icon img { max-width: 100%; max-height: 34vh; border-radius: 12px; object-fit: contain; background: #fff; border: 3px solid #fff; display: block; margin: 0 auto; }
  #timer { font-family: 'Bebas Neue', sans-serif; font-size: 44px; line-height: 1; color: var(--lime); display: none; }
  #timer.low { color: #ff6b6b; }
  #msg { font-size: clamp(20px, 6vh, 30px); font-weight: 800; line-height: 1.25; }
  #detail { font-size: 12px; color: var(--muted); line-height: 1.35; }
  .meter { width: 100%; height: 6px; background: #ffffff18; border-radius: 99px; position: relative; overflow: visible; display: none; margin-top: 4px; }
  .meter .fill { height: 100%; border-radius: 99px; background: var(--lime); }
  .meter .need { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #fff; }
  #screen.win { background: var(--peach); color: #3a2418; animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  #screen.win #detail { color: #6b4a3a; }
  @keyframes pop { from { transform: scale(.85); } }

  #grab {
    width: min(42vh, 24vw, 200px); aspect-ratio: 1; border-radius: 50%; border: 0; font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(26px, 8vh, 44px); letter-spacing: 2px; color: #1f3005;
    background: radial-gradient(circle at 38% 30%, #e6ffb3, var(--lime) 45%, var(--lime2));
    box-shadow: 0 12px 0 #4c720f, 0 16px 26px rgba(0,0,0,.55), inset 0 -8px 14px rgba(0,0,0,.15);
    transition: transform .05s;
  }
  #grab.on { transform: translateY(10px); box-shadow: 0 2px 0 #4c720f, 0 4px 10px rgba(0,0,0,.5), inset 0 -4px 8px rgba(0,0,0,.15); }
  #grab.pulse { animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 12px 0 #4c720f, 0 16px 26px rgba(0,0,0,.55), 0 0 0 12px rgba(182,242,74,.2); } }

  .overlay { position: fixed; inset: 0; background: rgba(8,8,10,.94); display: flex; align-items: center; justify-content: center; text-align: center; padding: 30px; font-size: 20px; z-index: 5; flex-direction: column; gap: 16px; }
  .overlay.hide { display: none; }
  .overlay button { font: inherit; font-size: 18px; border: 0; border-radius: 16px; padding: 12px 22px; background: var(--lime); color: #1f3005; }
  .overlay .sub { font-size: 14px; color: var(--muted); }
  #rotate .phone { font-size: 64px; animation: rot 1.6s ease-in-out infinite; }
  @keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: landscape) { #rotate { display: none !important; } }
</style>
</head>
<body>
  <div id="pad">
    <header>
      <span class="logo">강동 청년회 럭키박스 <small>made by 기획문화부</small></span>
      <div class="pill"><span class="dot" id="dot"></span><span id="conn">연결 중</span></div>
    </header>
    <div class="zone">
      <button class="arrow" id="left" aria-label="왼쪽">◀</button>
      <button class="arrow" id="right" aria-label="오른쪽">▶</button>
    </div>
    <div id="screen">
      <div id="icon">🕹️</div>
      <div id="timer">15</div>
      <div id="msg">연결하는 중…</div>
      <div id="detail"></div>
      <svg id="jsvg" viewBox="0 0 160 70" width="150" height="66" style="display:none"></svg>
    </div>
    <div class="zone"><button id="grab">GRAB</button></div>
  </div>

  <div class="overlay" id="rotate">
    <div class="phone">📱</div>
    <div>폰을 <b>가로</b>로 돌려주세요</div>
    <div class="sub">게임패드처럼 양손으로 잡고 해요</div>
  </div>
  <div class="overlay hide" id="overlay"><div id="ovText">게임 화면에 연결하는 중…</div></div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="net.js?v=202611221006"></script>
<script>
(() => {
  const room = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
  const $ = (id) => document.getElementById(id);
  const ov = $('overlay'), ovText = $('ovText');
  const myId = Math.random().toString(36).slice(2, 10);
  let net, joined = false, phase = 'ready', kicked = false, lastHost = 0, resultUntil = 0;

  function showOverlay(text, retry) {
    ov.classList.remove('hide'); ovText.textContent = text;
    ov.querySelectorAll('button').forEach(b => b.remove());
    if (retry) {
      const b = document.createElement('button'); b.textContent = '다시 연결';
      b.onclick = () => { kicked = false; showOverlay('게임 화면에 연결하는 중…'); net.send({ type: 'join', id: myId }); };
      ov.appendChild(b);
    }
  }
  function setJoined(on) { joined = on; $('dot').classList.toggle('on', on); $('conn').textContent = on ? '연결됨' : '끊김'; }
  function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }
  if (!room) { showOverlay('주소에 방 코드가 없어요. 화면의 QR을 찍어주세요.'); return; }

  let triedFs = false;
  document.addEventListener('pointerdown', () => {
    if (triedFs) return; triedFs = true;
    const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) Promise.resolve(req.call(el)).then(() => screen.orientation?.lock?.('landscape')).catch(() => {});
  });

  function send(m) { if (joined) net.send({ ...m, id: myId }); }

  // ---------- 화면 ----------
  function setScreen(icon, msg, detail = '', meter = null) {
    $('icon').innerHTML = icon || '';
    $('icon').style.display = icon ? '' : 'none';
    $('msg').textContent = msg; $('detail').textContent = detail;
    drawJudge(meter);
  }
  // 판정 그림: 캡슐 단면 + 허용 구간(연두) + 집게가 내려간 위치(화살표)
  function drawJudge(j) {
    const svg = $('jsvg');
    if (!j || j.kind === 'none' || j.off == null) { svg.style.display = 'none'; return; }
    svg.style.display = '';
    const cx = 80, cy = 46, R = 26, z = j.zone * R;
    const px = cx + j.side * Math.min(1.25, j.off) * R;
    const col = j.kind === 'ok' ? '#b6f24a' : (j.kind === 'blocked' ? '#ffaa3c' : '#ff5f5f');
    svg.innerHTML = `
      <path d="M${cx - R} ${cy} A${R} ${R} 0 0 1 ${cx + R} ${cy} Z" fill="#c9ccd2"/>
      <path d="M${cx - R} ${cy} A${R} ${R} 0 0 0 ${cx + R} ${cy} Z" fill="#f1efe9"/>
      <rect x="${cx - z}" y="${cy - R - 12}" width="${z * 2}" height="${R * 2 + 12}" fill="rgba(182,242,74,.4)"/>
      <line x1="${cx - z}" y1="${cy - R - 12}" x2="${cx - z}" y2="${cy + R}" stroke="#b6f24a" stroke-dasharray="3 3"/>
      <line x1="${cx + z}" y1="${cy - R - 12}" x2="${cx + z}" y2="${cy + R}" stroke="#b6f24a" stroke-dasharray="3 3"/>
      <line x1="${cx}" y1="${cy - R - 12}" x2="${cx}" y2="${cy + R}" stroke="rgba(255,255,255,.6)"/>
      <line x1="${px}" y1="2" x2="${px}" y2="${cy - 12}" stroke="${col}" stroke-width="3"/>
      <path d="M${px} ${cy - 6} L${px - 5} ${cy - 14} L${px + 5} ${cy - 14} Z" fill="${col}"/>
      ${j.kind === 'blocked' ? `<text x="${cx}" y="${cy + 16}" font-size="16" text-anchor="middle">🔒</text>` : ''}`;
  }
  function idle() { $('screen').classList.remove('win'); setScreen('🕹️', '◀ ▶ 를 누르면 시작!', '캡슐 정중앙을 노리세요 · 틈 사이로 아래 캡슐도 잡혀요'); }
  const PHASE = { drop: ['⬇️', '툭!'], close: ['🤏', '꽉!'], rise: ['⬆️', '올라가는 중…'], reveal: ['✨', '두근두근…'] };
  let lastTick = -1;
  function onState(m) {
    const prev = phase; phase = m.phase;
    const canMove = phase === 'ready' || phase === 'move';
    $('left').disabled = $('right').disabled = $('grab').disabled = !canMove;
    $('grab').classList.toggle('pulse', phase === 'move');
    const t = $('timer'); t.style.display = phase === 'move' ? 'block' : 'none';
    t.textContent = m.timer; t.classList.toggle('low', m.timer <= 3);
    if (Date.now() < resultUntil && (phase === 'ready' || phase === 'result')) return;
    if (phase === 'move' && prev !== 'move') { $('screen').classList.remove('win'); setScreen('', '위치를 맞추고', '점선이 집게가 떨어질 자리예요'); }
    if (PHASE[phase] && prev !== phase) { $('screen').classList.remove('win'); setScreen(PHASE[phase][0], PHASE[phase][1]); }
    if (phase === 'ready' && prev !== 'ready') idle();
    if (phase === 'move' && m.timer <= 3 && m.timer !== lastTick) { lastTick = m.timer; buzz(25); }
  }
  function onResult(m) {
    resultUntil = Date.now() + 5000;
    $('screen').classList.toggle('win', !!m.ok);
    const icon = m.ok ? (m.img ? `<img src="${m.img}">` : (m.emoji || '🎁')) : (m.emoji || '😢');
    setScreen(icon, m.title, m.detail || '', m.ok ? null : m.judge);
    buzz(m.ok ? [120, 60, 120, 60, 400] : [200]);
    setTimeout(() => { if (Date.now() >= resultUntil && phase === 'ready') idle(); }, 5100);
  }
  function onFx(m) {
    if (m.kind === 'drop') buzz(20);
    if (m.kind === 'touch') buzz(60);
    if (m.kind === 'grab') buzz([30, 30, 50]);
    if (m.kind === 'slip') buzz([20, 40, 20, 40, 120]);
  }

  // ---------- 연결 ----------
  function connect() {
    showOverlay('게임 화면에 연결하는 중…');
    net = ClawNet.open(room, 'ctl', {
      onOpen: () => { if (!kicked) net.send({ type: 'join', id: myId }); },
      onClose: () => { if (joined) { setJoined(false); showOverlay('인터넷 연결이 끊겼어요. 다시 연결하는 중…'); } },
      onMessage: (m) => {
        if (m.type === 'joined' && m.id === myId) { setJoined(true); lastHost = Date.now(); ov.classList.add('hide'); idle(); buzz(30); }
        if (m.type === 'kicked' && m.id === myId) { kicked = true; setJoined(false); showOverlay('다른 폰이 게임패드로 연결됐어요.', true); }
        if (m.type === 'state') { lastHost = Date.now(); if (!joined && !kicked) net.send({ type: 'join', id: myId }); if (joined) onState(m); }
        if (!joined) return;
        if (m.type === 'result') onResult(m);
        if (m.type === 'fx') onFx(m);
        if (m.type === 'judge') { resultUntil = Date.now() + 2500; $('screen').classList.remove('win'); setScreen('', m.title, m.detail, m.judge); buzz(m.judge && m.judge.kind === 'ok' ? [40, 30, 80] : 150); }
      },
    });
    setInterval(() => {
      if (joined) net.send({ type: 'ping', id: myId });
      else if (!kicked && net.online) net.send({ type: 'join', id: myId });
      if (joined && Date.now() - lastHost > 9000) { setJoined(false); showOverlay('게임 화면을 찾을 수 없어요. 화면이 열려 있는지 확인해주세요.'); }
    }, 2000);
  }

  // ---------- 좌우 버튼 (누르고 있는 동안 이동) ----------
  const held = { left: false, right: false };
  function hold(el, key) {
    const down = (e) => { e.preventDefault(); if (el.disabled || held[key]) return; held[key] = true; el.classList.add('on'); try { el.setPointerCapture(e.pointerId); } catch {} send({ type: 'input', key, down: true }); buzz(12); };
    const up = (e) => { e.preventDefault(); if (!held[key]) return; held[key] = false; el.classList.remove('on'); send({ type: 'input', key, down: false }); };
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('lostpointercapture', up);
  }
  hold($('left'), 'left'); hold($('right'), 'right');
  // 누르고 있으면 주기적으로 다시 보냄 (신호 유실 대비)
  setInterval(() => { for (const k of ['left', 'right']) if (held[k]) send({ type: 'input', key: k, down: true }); }, 400);

  const grab = $('grab');
  grab.addEventListener('pointerdown', (e) => {
    e.preventDefault(); if (grab.disabled) return;
    grab.classList.add('on'); buzz(50);
    for (const k of ['left', 'right']) if (held[k]) { held[k] = false; $(k).classList.remove('on'); send({ type: 'input', key: k, down: false }); }
    send({ type: 'grab' });
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => grab.addEventListener(t, () => grab.classList.remove('on')));
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  connect();
})();
</script>
</body>
</html>
