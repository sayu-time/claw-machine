<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강동 청년회 럭키박스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
<link rel="stylesheet" href="capsule.css?v=202611221559">
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>

    <div class="topbar">
      <div class="seg" id="orient">
        <button data-o="auto">자동</button><button data-o="landscape">가로</button><button data-o="portrait">세로</button>
      </div>
      <button class="iconBtn" id="openSettings">⚙️ 상품 설정</button>
    </div>

    <div id="start">
      <div id="qrBox"></div>
      <div id="startText">QR을 찍고 <b>강동 청년회 럭키박스</b>에 참여하세요!<br>폰이 게임패드가 돼요</div>
      <div id="status"><span class="dot" id="dot"></span><span id="statusText">연결 준비 중…</span></div>
    </div>

    <div id="credit">made by <b>기획문화부</b></div>
    <div class="hud" id="timer">20</div>
    <div class="hud" id="hint"></div>
    <div class="hud" id="toast"></div>
    <div class="hud" id="judge">
      <canvas id="judgeCv" width="240" height="120"></canvas>
      <div><div id="judgeTitle"></div><div id="judgeDetail"></div><div class="jLegend"><i class="z"></i>허용 구간 <i class="m"></i>집게 위치</div></div>
    </div>

    <div id="reveal">
      <div class="dim"></div>
      <div class="rays"></div>
      <div class="glow"></div>
      <div class="flash"></div>
      <div class="banner">축하합니다!</div>
      <div class="cap3d" id="cap3d">
        <div class="half bot"></div>
        <div class="prize3d" id="prize3d"></div>
        <div class="half top"></div>
        <div class="seam"></div>
      </div>
      <div class="card"><h3 id="revealTitle"></h3><p id="revealSub"></p></div>
    </div>
  </div>

  <div class="modal" id="settings">
    <div class="sheet">
      <h2>⚙️ 상품 설정</h2>
      <div class="hint2">캡슐 안에 들어갈 상품을 정하세요. 수량만큼 캡슐이 생겨요. 캡슐 밖에서는 안이 보이지 않고, 뽑아서 열면 상품 사진과 설명이 크게 나와요.</div>
      <div class="opts">
        <div><label>꽝 캡슐 수</label><input type="number" id="optBlank" min="0" max="100">
          <label style="margin-top:6px;display:flex;gap:6px;align-items:center;color:#ddd"><input type="checkbox" id="optFill" style="width:auto"> 빈자리는 꽝 캡슐로 채우기</label></div>
        <div><label>난이도 (집게 정확도)</label>
          <select id="optDiff"><option value="0.35">쉬움</option><option value="0.55">보통</option><option value="0.72">어려움</option></select></div>
        <div><label>한 판 시간</label>
          <select id="optTime"><option value="10">10초</option><option value="15">15초</option><option value="20">20초</option><option value="30">30초</option></select></div>
      </div>
      <div class="hdr"><span>상품 사진</span><span>이름 · 설명</span><span>이모지</span><span>수량</span><span></span></div>
      <div id="prizeList"></div>
      <details><summary class="hint2">🏆 당첨 기록</summary><div id="history"></div></details>
      <div class="actions">
        <div class="left"><button class="btn ghost" id="addPrize">＋ 상품 추가</button><button class="btn ghost" id="resetPrizes">기본값</button></div>
        <button class="btn ghost" id="cancelSettings">취소</button>
        <button class="btn" id="saveSettings">저장하고 다시 채우기</button>
      </div>
    </div>
  </div>
  <input type="file" id="filePick" accept="image/*" hidden>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="net.js?v=202611221559"></script>
  <script src="game.js?v=202611221559"></script>
</body>
</html>
