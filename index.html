<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>럭키 캡슐</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Bebas+Neue&display=swap">
<style>
  :root {
    --bg: #0d0d10; --panel2: #2c2c35; --text: #f6f6f8; --muted: #a9a9b6;
    --lime: #b6f24a; --peach: #ffd9c4; --line: rgba(255,255,255,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Jua', system-ui, sans-serif; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); overflow: hidden; background: #6f7378; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  /* 상단 버튼 (시작 화면에서만) */
  .topbar { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; gap: 8px; z-index: 6; transition: opacity .3s; }
  .seg { display: flex; background: rgba(0,0,0,.45); border-radius: 99px; padding: 4px; backdrop-filter: blur(6px); }
  .seg button { border: 0; background: transparent; color: #ddd; font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 99px; cursor: pointer; }
  .seg button.on { background: #fff; color: #222; }
  .iconBtn { border: 0; background: rgba(0,0,0,.45); color: #fff; font: inherit; font-size: 14px; padding: 9px 14px; border-radius: 99px; cursor: pointer; backdrop-filter: blur(6px); }
  body.playing .topbar { opacity: 0; pointer-events: none; }

  /* 시작 화면 QR (캡슐 더미 위) */
  #start { position: absolute; left: 50%; transform: translateX(-50%); bottom: 8%; z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; transition: opacity .4s; width: 90%; }
  #start.hide { opacity: 0; pointer-events: none; }
  #qrBox { background: #fff; padding: 10px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.35); line-height: 0; }
  #qrBox img, #qrBox canvas { width: var(--qr, 150px) !important; height: var(--qr, 150px) !important; }
  #startText { font-size: clamp(14px, 2.4vmin, 24px); color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.8); line-height: 1.4; }
  #startText b { color: var(--lime); }
  #status { font-size: 13px; color: #fff; background: rgba(0,0,0,.5); padding: 5px 12px; border-radius: 99px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #888; }
  .dot.on { background: var(--lime); box-shadow: 0 0 8px var(--lime); }

  /* HUD */
  .hud { position: absolute; pointer-events: none; z-index: 4; }
  #timer { top: 4%; right: 6%; font-family: 'Bebas Neue', sans-serif; font-size: clamp(36px, 8vmin, 80px); color: #fff; text-shadow: 0 3px 8px rgba(0,0,0,.5); display: none; }
  #timer.low { color: #ff6b6b; }
  #hint { left: 50%; top: 42%; transform: translate(-50%, -50%); background: rgba(0,0,0,.45); padding: 12px 22px; border-radius: 99px; font-size: clamp(14px, 2.6vmin, 24px); display: none; white-space: nowrap; }
  #toast { left: 50%; top: 32%; transform: translate(-50%, -50%) scale(.8); font-size: clamp(24px, 5.5vmin, 52px); color: #fff; text-shadow: 0 3px 10px rgba(0,0,0,.6); opacity: 0; transition: all .25s; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* 판정 근거 패널 */
  #judge { left: 50%; top: 13%; transform: translate(-50%, -10px); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; background: rgba(12,12,16,.85); backdrop-filter: blur(6px); border-radius: 18px; padding: 12px 14px; opacity: 0; transition: opacity .25s, transform .25s; border: 2px solid transparent; width: min(44%, 280px); }
  #judge.show { opacity: 1; transform: translate(-50%, 0); }
  #judge.ok { border-color: #b6f24a; }
  #judge.bad { border-color: #ff5f5f; }
  #stage #judgeCv { width: clamp(110px, 16vmin, 180px); height: auto; flex: none; }
  #judge > div { min-width: 0; }
  .jLegend { justify-content: center; flex-wrap: wrap; }
  #judgeTitle { font-size: clamp(20px, 4vmin, 34px); }
  #judge.ok #judgeTitle { color: #b6f24a; }
  #judge.bad #judgeTitle { color: #ff8a8a; }
  #judgeDetail { font-size: clamp(12px, 2vmin, 17px); color: #ddd; margin-top: 2px; }
  .jLegend { font-size: 11px; color: #999; margin-top: 6px; display: flex; align-items: center; gap: 6px; }
  .jLegend i { display: inline-block; width: 12px; height: 8px; border-radius: 2px; }
  .jLegend i.z { background: rgba(182,242,74,.6); }
  .jLegend i.m { background: #fff; width: 3px; height: 12px; margin-left: 6px; }

  /* ===== 3D 캡슐 개봉 연출 ===== */
  #reveal { position: absolute; inset: 0; z-index: 8; pointer-events: none; perspective: 900px; display: none; }
  #reveal.show { display: block; }
  #reveal .dim { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, rgba(255,255,255,.15), rgba(0,0,0,.7) 70%); opacity: 0; transition: opacity .5s; }
  #reveal.on .dim { opacity: 1; }
  .cap3d { position: absolute; width: var(--s); height: var(--s); left: 0; top: 0; transform-style: preserve-3d; will-change: transform; }
  .cap3d .half { position: absolute; left: 0; width: 100%; height: 50%; transition: transform .7s cubic-bezier(.3,1.6,.5,1); }
  .cap3d .top { top: 0; border-radius: var(--s) var(--s) 0 0; transform-origin: 50% 100%; z-index: 2;
    background: radial-gradient(circle at 32% 40%, rgba(255,255,255,.95) 0 5%, rgba(255,255,255,.35) 13%, transparent 28%), radial-gradient(ellipse at 50% 100%, var(--c2) 0%, var(--c) 55%, var(--c3) 100%);
    box-shadow: inset 0 -6px 10px rgba(0,0,0,.12); }
  .cap3d .bot { bottom: 0; border-radius: 0 0 var(--s) var(--s); transform-origin: 50% 0%;
    background: radial-gradient(ellipse at 50% 0%, #fff 0%, #f1efe9 55%, #bdb9b1 100%);
    box-shadow: inset 0 8px 10px rgba(0,0,0,.08); }
  .cap3d .seam { position: absolute; left: -1%; right: -1%; top: calc(50% - 3px); height: 6px; background: linear-gradient(#fff, #d8d4cc); border-radius: 3px; z-index: 3; transition: opacity .2s; }
  .cap3d.open .top { transform: translateY(-45%) rotateX(-120deg); }
  .cap3d.open .bot { transform: translateY(35%) rotateX(40deg); }
  .cap3d.open .seam { opacity: 0; }
  .prize3d { position: absolute; left: 50%; top: 50%; z-index: 1; transform: translate(-50%, -50%) scale(0); font-size: calc(var(--s) * .62); line-height: 1; transition: transform .7s cubic-bezier(.2,1.8,.4,1) .15s; filter: drop-shadow(0 12px 18px rgba(0,0,0,.35)); }
  .prize3d img { width: calc(var(--s) * .8); height: calc(var(--s) * .8); border-radius: 50%; object-fit: cover; border: 5px solid #fff; display: block; }
  .cap3d.open .prize3d { transform: translate(-50%, -80%) scale(1.1); z-index: 4; }
  .rays { position: absolute; left: 50%; top: 45%; width: 160vmax; height: 160vmax; transform: translate(-50%, -50%) scale(0); background: repeating-conic-gradient(rgba(255,240,180,.25) 0 8deg, transparent 8deg 20deg); border-radius: 50%; transition: transform .8s ease-out; animation: spin 14s linear infinite; -webkit-mask: radial-gradient(circle, #000 0, transparent 45%); mask: radial-gradient(circle, #000 0, transparent 45%); }
  #reveal.burst .rays { transform: translate(-50%, -50%) scale(1); }
  #reveal.blank .rays { display: none; }
  @keyframes spin { to { rotate: 360deg; } }
  .card { position: absolute; left: 50%; bottom: 9%; transform: translate(-50%, 30px); opacity: 0; transition: all .5s cubic-bezier(.2,1.4,.4,1) .35s; background: var(--peach); color: #3a2418; padding: 14px 30px; border-radius: 22px; text-align: center; box-shadow: 0 16px 40px rgba(0,0,0,.35); min-width: 220px; }
  .card h3 { margin: 0; font-size: clamp(22px, 5vmin, 44px); }
  .card p { margin: 4px 0 0; font-size: clamp(13px, 2.2vmin, 18px); opacity: .75; }
  #reveal.burst .card { transform: translate(-50%, 0); opacity: 1; }
  .spark { position: absolute; border-radius: 50%; left: 50%; top: 45%; pointer-events: none; }

  /* 설정 모달 */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  .modal.show { display: flex; }
  .sheet { background: #1d1d24; border-radius: 22px; padding: 20px; width: min(760px, 100%); max-height: 92vh; display: flex; flex-direction: column; gap: 12px; border: 1px solid var(--line); }
  .sheet h2 { margin: 0; color: var(--lime); }
  .hint2 { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: var(--panel2); padding: 12px; border-radius: 14px; }
  .opts label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  #prizeList { overflow: auto; display: flex; flex-direction: column; gap: 8px; }
  .row, .hdr { display: grid; grid-template-columns: 56px 1fr 80px 80px 40px; gap: 8px; align-items: center; }
  .row { background: var(--panel2); padding: 8px; border-radius: 12px; }
  .hdr { font-size: 12px; color: var(--muted); padding: 0 8px; }
  .thumb { width: 56px; height: 56px; border-radius: 50%; background: #fff2; display: flex; align-items: center; justify-content: center; font-size: 30px; overflow: hidden; cursor: pointer; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .row input, .opts select, .opts input { font: inherit; font-size: 15px; width: 100%; padding: 8px; border-radius: 10px; border: 0; background: #fff; color: #222; }
  button.btn { font-family: inherit; font-size: 15px; border: 0; border-radius: 12px; padding: 10px 14px; cursor: pointer; background: var(--lime); color: #1a2a05; }
  button.btn.ghost { background: var(--panel2); color: var(--text); }
  button.del { background: #ff5f5f; color: #fff; border: 0; border-radius: 10px; padding: 8px; cursor: pointer; font: inherit; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .actions .left { margin-right: auto; display: flex; gap: 8px; }
  #history { font-size: 13px; color: var(--muted); max-height: 90px; overflow: auto; line-height: 1.6; }
  @media (max-width: 600px) { .opts { grid-template-columns: 1fr 1fr; } .row, .hdr { grid-template-columns: 48px 1fr 64px 64px 36px; } }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>

    <div class="topbar">
      <div class="seg" id="orient">
        <button data-o="auto">자동</button><button data-o="landscape">가로</button><button data-o="portrait">세로</button>
      </div>
      <button class="iconBtn" id="openSettings">⚙️ 상품 설정</button>
    </div>

    <div id="start">
      <div id="qrBox"></div>
      <div id="startText">QR을 찍고 <b>럭키 캡슐</b>에 참여하세요!<br>폰이 게임패드가 돼요</div>
      <div id="status"><span class="dot" id="dot"></span><span id="statusText">연결 준비 중…</span></div>
    </div>

    <div class="hud" id="timer">20</div>
    <div class="hud" id="hint"></div>
    <div class="hud" id="toast"></div>
    <div class="hud" id="judge">
      <canvas id="judgeCv" width="240" height="120"></canvas>
      <div><div id="judgeTitle"></div><div id="judgeDetail"></div><div class="jLegend"><i class="z"></i>허용 구간 <i class="m"></i>집게 위치</div></div>
    </div>

    <div id="reveal">
      <div class="dim"></div>
      <div class="rays"></div>
      <div class="cap3d" id="cap3d">
        <div class="half bot"></div>
        <div class="prize3d" id="prize3d"></div>
        <div class="half top"></div>
        <div class="seam"></div>
      </div>
      <div class="card"><h3 id="revealTitle"></h3><p id="revealSub"></p></div>
    </div>
  </div>

  <div class="modal" id="settings">
    <div class="sheet">
      <h2>⚙️ 상품 설정</h2>
      <div class="hint2">캡슐 안에 들어갈 상품을 정하세요. 수량만큼 캡슐이 생겨요. 동그라미를 누르면 사진을 넣을 수 있어요.</div>
      <div class="opts">
        <div><label>꽝 캡슐 수</label><input type="number" id="optBlank" min="0" max="60"></div>
        <div><label>난이도 (집게 정확도)</label>
          <select id="optDiff"><option value="0.35">쉬움</option><option value="0.55">보통</option><option value="0.72">어려움</option></select></div>
        <div><label>한 판 시간</label>
          <select id="optTime"><option value="10">10초</option><option value="15">15초</option><option value="20">20초</option><option value="30">30초</option></select></div>
      </div>
      <div class="hdr"><span>사진</span><span>이름</span><span>이모지</span><span>수량</span><span></span></div>
      <div id="prizeList"></div>
      <details><summary class="hint2">🏆 당첨 기록</summary><div id="history"></div></details>
      <div class="actions">
        <div class="left"><button class="btn ghost" id="addPrize">＋ 상품 추가</button><button class="btn ghost" id="resetPrizes">기본값</button></div>
        <button class="btn ghost" id="cancelSettings">취소</button>
        <button class="btn" id="saveSettings">저장하고 다시 채우기</button>
      </div>
    </div>
  </div>
  <input type="file" id="filePick" accept="image/*" hidden>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="net.js?v=202611212316"></script>
  <script src="game.js?v=202611212316"></script>
</body>
</html>
