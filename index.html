<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인형뽑기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  :root {
    --bg: #1b1035; --panel: #2a1a52; --panel2: #352266; --text: #fff6fb; --muted: #c9b8ef;
    --pink: #ff5fa2; --yellow: #ffd23f; --mint: #3ee6c1; --line: rgba(255,255,255,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(circle at 30% 10%, #3a1f73 0, var(--bg) 60%);
    color: var(--text); font-family: 'Jua', system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; gap: 28px; padding: 20px;
    overflow: hidden;
  }
  #stage { position: relative; height: calc(100vh - 40px); aspect-ratio: 560 / 760; max-width: 62vw; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 28px; box-shadow: 0 0 0 8px var(--pink), 0 0 0 14px #b8387a, 0 20px 60px rgba(0,0,0,.6); }
  aside { width: 300px; display: flex; flex-direction: column; gap: 16px; max-height: calc(100vh - 40px); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 18px; }
  h1 { margin: 0 0 4px; font-size: 34px; color: var(--yellow); text-shadow: 0 3px 0 #b8387a; letter-spacing: 1px; }
  .sub { color: var(--muted); font-size: 15px; }
  #qrBox { background: #fff; border-radius: 14px; padding: 10px; display: flex; justify-content: center; margin: 12px 0 8px; min-height: 200px; align-items: center; color: #333; }
  #qrBox img, #qrBox canvas { width: 200px !important; height: 200px !important; box-shadow: none; border-radius: 0; }
  #link { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); word-break: break-all; }
  #status { display: flex; align-items: center; gap: 8px; font-size: 17px; margin-top: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #888; flex: none; }
  .dot.on { background: var(--mint); box-shadow: 0 0 10px var(--mint); }
  select { font: inherit; font-size: 13px; padding: 4px; border-radius: 8px; margin-top: 6px; width: 100%; }
  button { font-family: inherit; font-size: 17px; border: 0; border-radius: 14px; padding: 12px 14px; cursor: pointer; color: #2a1a52; background: var(--yellow); box-shadow: 0 4px 0 #b88f00; }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 #b88f00; }
  button.ghost { background: var(--panel2); color: var(--text); box-shadow: 0 4px 0 #1a0f38; }
  #history { overflow: auto; min-height: 60px; flex: 1; }
  #history ol { margin: 8px 0 0; padding-left: 22px; color: var(--muted); }
  #history li { margin: 4px 0; color: var(--text); }
  .keys { font-size: 13px; color: var(--muted); margin-top: 10px; }

  /* 설정 모달 */
  .modal { position: fixed; inset: 0; background: rgba(10,5,25,.7); display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  .modal.show { display: flex; }
  .sheet { background: var(--panel); border-radius: 24px; padding: 22px; width: min(760px, 100%); max-height: 90vh; display: flex; flex-direction: column; gap: 14px; border: 1px solid var(--line); }
  .sheet h2 { margin: 0; color: var(--yellow); }
  #prizeList { overflow: auto; display: flex; flex-direction: column; gap: 10px; }
  .row { display: grid; grid-template-columns: 64px 1fr 90px 80px 90px 40px; gap: 8px; align-items: center; background: var(--panel2); padding: 10px; border-radius: 14px; }
  .row .thumb { width: 64px; height: 64px; border-radius: 50%; background: #fff2; display: flex; align-items: center; justify-content: center; font-size: 36px; overflow: hidden; cursor: pointer; position: relative; }
  .row .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .row input { font: inherit; font-size: 16px; width: 100%; padding: 8px; border-radius: 10px; border: 0; background: #fff; color: #2a1a52; }
  .row label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 2px; }
  .row .del { background: #ff5f5f; color: #fff; box-shadow: 0 4px 0 #a33; padding: 8px; }
  .hdr { display: grid; grid-template-columns: 64px 1fr 90px 80px 90px 40px; gap: 8px; font-size: 13px; color: var(--muted); padding: 0 10px; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .actions .left { margin-right: auto; display: flex; gap: 10px; }
  .hint { font-size: 13px; color: var(--muted); }

  /* 당첨 연출 */
  #win { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 20; background: rgba(10,5,25,.55); }
  #win.show { display: flex; animation: fade .3s; }
  #win .box { background: linear-gradient(160deg, #ff8cc0, #ff5fa2); border-radius: 32px; padding: 30px 50px; text-align: center; box-shadow: 0 0 0 8px var(--yellow), 0 30px 80px rgba(0,0,0,.5); animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  #win .big { font-size: 120px; line-height: 1.1; }
  #win .big img { width: 160px; height: 160px; border-radius: 50%; object-fit: cover; border: 6px solid #fff; }
  #win h3 { font-size: 30px; margin: 10px 0 0; }
  #win p { font-size: 44px; margin: 6px 0 0; color: #fff; text-shadow: 0 3px 0 #b8387a; }
  @keyframes pop { from { transform: scale(.3) rotate(-10deg); } to { transform: none; } }
  @keyframes fade { from { opacity: 0; } }

  @media (max-width: 900px) {
    body { flex-direction: column; overflow: auto; height: auto; }
    #stage { height: auto; width: 100%; max-width: 520px; }
    aside { width: 100%; max-width: 520px; max-height: none; }
    .row, .hdr { grid-template-columns: 52px 1fr 70px 64px 70px 36px; }
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="game" width="560" height="760"></canvas></div>

  <aside>
    <div class="card">
      <h1>인형뽑기</h1>
      <div class="sub">폰으로 QR을 찍으면 컨트롤러가 돼요<br>와이파이·LTE 상관없이 연결돼요</div>
      <div id="qrBox">QR 만드는 중…</div>
      <div id="link"></div>
      <div id="status"><span class="dot" id="dot"></span><span id="statusText">폰 연결 대기 중</span></div>
      <div class="keys">PC 키보드: ← → 이동 · Space 뽑기</div>
    </div>
    <div class="card" style="display:flex; gap:10px;">
      <button id="openSettings" style="flex:1">🎁 상품 설정</button>
      <button id="refill" class="ghost" title="기계 다시 채우기">🔄</button>
    </div>
    <div class="card" id="history">
      <div>🏆 뽑은 상품</div>
      <ol id="historyList"></ol>
    </div>
  </aside>

  <div class="modal" id="settings">
    <div class="sheet">
      <h2>🎁 상품 설정</h2>
      <div class="hint">동그라미를 눌러 사진을 넣을 수 있어요. 성공률은 집게가 제대로 잡았을 때 끝까지 들고 오는 확률이에요.</div>
      <div class="hdr"><span>사진</span><span>이름</span><span>이모지</span><span>수량</span><span>성공률 %</span><span></span></div>
      <div id="prizeList"></div>
      <div class="actions">
        <div class="left">
          <button class="ghost" id="addPrize">＋ 상품 추가</button>
          <button class="ghost" id="resetPrizes">기본값</button>
        </div>
        <button class="ghost" id="cancelSettings">취소</button>
        <button id="saveSettings">저장하고 다시 채우기</button>
      </div>
    </div>
  </div>
  <input type="file" id="filePick" accept="image/*" hidden>

  <div id="win"><div class="box"><div class="big" id="winIcon"></div><h3 id="winName"></h3><p>🎉 당첨! 🎉</p></div></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="net.js"></script>
  <script src="game.js"></script>
</body>
</html>
